<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Airport terminal ceiling access route survey handoff</title>
  <desc id="desc">Five generic route segments connect a delivery point to a controlled work-face handoff without depicting a real airport.</desc>
  <rect width="1600" height="900" fill="#071927"/>
  <rect x="70" y="72" width="1460" height="756" rx="34" fill="#102b3d" stroke="#2e6c88" stroke-width="4"/>
  <text x="120" y="155" fill="#f1f8fb" font-family="Arial, sans-serif" font-size="58" font-weight="700">Freeze the route before equipment review</text>
  <text x="120" y="216" fill="#a9cfdf" font-family="Arial, sans-serif" font-size="42">Each segment needs an owner, evidence status and explicit handoff.</text>
  <path d="M225 505H1375" fill="none" stroke="#50bfd0" stroke-width="10" stroke-linecap="round" stroke-dasharray="18 18"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g><rect x="125" y="405" width="210" height="190" rx="28" fill="#17415a" stroke="#7bd7df" stroke-width="5"/><text x="230" y="515" fill="#fff" font-size="44" font-weight="700" data-role="decision-label">Entry</text></g>
    <g><rect x="410" y="405" width="210" height="190" rx="28" fill="#17415a" stroke="#7bd7df" stroke-width="5"/><text x="515" y="515" fill="#fff" font-size="44" font-weight="700" data-role="decision-label">Door + turn</text></g>
    <g><rect x="695" y="405" width="210" height="190" rx="28" fill="#285e70" stroke="#f4bd5d" stroke-width="5"/><text x="800" y="515" fill="#fff" font-size="44" font-weight="700" data-role="decision-label">Floor</text></g>
    <g><rect x="980" y="405" width="210" height="190" rx="28" fill="#17415a" stroke="#7bd7df" stroke-width="5"/><text x="1085" y="515" fill="#fff" font-size="44" font-weight="700" data-role="decision-label">Overhead</text></g>
    <g><rect x="1265" y="405" width="210" height="190" rx="28" fill="#17415a" stroke="#7bd7df" stroke-width="5"/><text x="1370" y="515" fill="#fff" font-size="44" font-weight="700" data-role="decision-label">Handover</text></g>
  </g>
  <rect x="210" y="678" width="1180" height="86" rx="18" fill="#0a2030" stroke="#2e6c88" stroke-width="3"/>
  <text x="800" y="734" text-anchor="middle" fill="#dceff5" font-family="Arial, sans-serif" font-size="42">A route record supports review; it does not grant access.</text>
  <text x="1450" y="795" text-anchor="end" fill="#7bd7df" font-family="Arial, sans-serif" font-size="42" font-weight="700">ARCLIFT</text>
</svg>
