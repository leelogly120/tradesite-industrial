<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Electrical interface boundary diagram</title>
  <desc id="desc">A non-wiring diagram separates site supply, machine group, upstream equipment and downstream handover interfaces.</desc>
  <rect width="1200" height="675" fill="#f2f3f8"/>
  <text x="60" y="85" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#293653">DEFINE BOUNDARIES BEFORE DETAILS</text>
  <g font-family="Arial,sans-serif">
    <rect x="60" y="200" width="230" height="230" rx="20" fill="#dce4f2" stroke="#516d9c" stroke-width="4"/>
    <rect x="380" y="145" width="440" height="340" rx="25" fill="#fff" stroke="#293653" stroke-width="5"/>
    <rect x="910" y="200" width="230" height="230" rx="20" fill="#f6e4d5" stroke="#bf7046" stroke-width="4"/>
    <g fill="#293653" font-size="25" font-weight="700"><text x="100" y="270">SITE SUPPLY</text><text x="480" y="215">MACHINE GROUP</text><text x="950" y="270">HANDOVER</text></g>
    <g fill="#64738c" font-size="18"><text x="100" y="320">incoming point</text><text x="100" y="355">isolation owner</text><text x="465" y="285">upstream interface</text><text x="465" y="335">line interface</text><text x="465" y="385">downstream interface</text><text x="950" y="320">signals • states</text><text x="950" y="355">document owner</text></g>
  </g>
  <g stroke="#d06c3f" stroke-width="8"><path d="M290 315h90"/><path d="M820 315h90"/></g>
  <text x="60" y="580" font-family="Arial,sans-serif" font-size="21" fill="#293653">Concept only — no wiring, safety circuit, rating, brand or compliance conclusion is depicted.</text>
</svg>
