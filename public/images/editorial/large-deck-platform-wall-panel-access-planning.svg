<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title>WALL-PANEL ACCESS decision diagram</title>
  <desc>large-deck platform wall-panel workflow lanes. An editorial planning diagram with four decision stages and no equipment specification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F8F7"/><stop offset="1" stop-color="#E5EEF1"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#6B4D45"/></marker>
  </defs>
  <rect width="1600" height="900" rx="44" fill="url(#bg)"/>
  <rect x="60" y="54" width="1480" height="792" rx="34" fill="none" stroke="#C5D5D9" stroke-width="4"/>
  <text x="100" y="145" font-family="Arial, sans-serif" font-size="66" font-weight="800" fill="#172A34">WALL-PANEL ACCESS</text>
  <text x="100" y="218" font-family="Arial, sans-serif" font-size="44" fill="#425E68">Coordinate delivery, staging and work-face access</text>
  <text x="1495" y="140" text-anchor="end" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="#6B4D45">ARCLIFT</text>
  <text x="1495" y="205" text-anchor="end" font-family="Arial, sans-serif" font-size="42" fill="#526B73">EDITORIAL DECISION MAP</text>
  <path d="M 250 560 C 320 560, 340 420, 410 420" fill="none" stroke="#6B4D45" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M 610 420 C 680 420, 700 560, 770 560" fill="none" stroke="#6B4D45" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M 970 560 C 1040 560, 1060 420, 1130 420" fill="none" stroke="#6B4D45" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>
  
    <circle cx="150" cy="560" r="96" fill="#FFFFFF" stroke="#6B4D45" stroke-width="12"/>
    <text x="150" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#172A34" data-role="decision-label">Deliver</text>
    <circle cx="510" cy="420" r="96" fill="#FFFFFF" stroke="#6B4D45" stroke-width="12"/>
    <text x="510" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#172A34" data-role="decision-label">Stage</text>
    <circle cx="870" cy="560" r="96" fill="#FFFFFF" stroke="#6B4D45" stroke-width="12"/>
    <text x="870" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#172A34" data-role="decision-label">Position</text>
    <circle cx="1230" cy="420" r="96" fill="#FFFFFF" stroke="#6B4D45" stroke-width="12"/>
    <text x="1230" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#172A34" data-role="decision-label">Complete</text>
  <rect x="100" y="750" width="1400" height="58" rx="29" fill="#6B4D45" opacity="0.12"/>
  <text x="800" y="791" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" fill="#273F48">Confirm conditions, responsibilities and open items before release.</text>
</svg>