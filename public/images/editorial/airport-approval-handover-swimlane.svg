<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Airport approval and handover swimlane</title>
  <desc id="desc">Editorial workflow separating operator permissions, project controls and technical input review.</desc>
  <rect width="1200" height="675" fill="#071923"/>
  <text x="72" y="72" fill="#f4f7f8" font-family="Arial,sans-serif" font-size="32" font-weight="700">APPROVAL + HANDOVER SWIMLANE</text>
  <text x="72" y="108" fill="#9fb2bb" font-family="Arial,sans-serif" font-size="18">Responsibilities stay separate until signed project release</text>
  <g font-family="Arial,sans-serif">
    <text x="72" y="205" fill="#2ed3c6" font-size="20" font-weight="700">OPERATOR</text>
    <line x1="250" y1="196" x2="1110" y2="196" stroke="#2ed3c6" stroke-width="3"/>
    <rect x="300" y="158" width="180" height="76" rx="14" fill="#153b45"/><text x="334" y="203" fill="#f4f7f8" font-size="18">zone + window</text>
    <rect x="770" y="158" width="180" height="76" rx="14" fill="#153b45"/><text x="806" y="203" fill="#f4f7f8" font-size="18">permission state</text>
    <text x="72" y="340" fill="#f5b64c" font-size="20" font-weight="700">PROJECT TEAM</text>
    <line x1="250" y1="331" x2="1110" y2="331" stroke="#f5b64c" stroke-width="3"/>
    <rect x="500" y="293" width="180" height="76" rx="14" fill="#3b3020"/><text x="533" y="338" fill="#f4f7f8" font-size="18">method controls</text>
    <rect x="970" y="293" width="140" height="76" rx="14" fill="#3b3020"/><text x="994" y="338" fill="#f4f7f8" font-size="18">release</text>
    <text x="72" y="475" fill="#c8d7dd" font-size="20" font-weight="700">TECHNICAL</text>
    <line x1="250" y1="466" x2="1110" y2="466" stroke="#91a8b1" stroke-width="3"/>
    <rect x="300" y="428" width="180" height="76" rx="14" fill="#243743"/><text x="338" y="473" fill="#f4f7f8" font-size="18">route inputs</text>
    <rect x="650" y="428" width="220" height="76" rx="14" fill="#243743"/><text x="680" y="473" fill="#f4f7f8" font-size="18">unknowns register</text>
  </g>
  <path d="M390 238 V287 M590 374 V422 M860 238 V287" stroke="#d7e3e7" stroke-width="4" stroke-dasharray="8 8"/>
  <text x="72" y="610" fill="#7f98a2" font-family="Arial,sans-serif" font-size="17">Editorial example — not an airport safety, security or construction-phasing plan</text>
</svg>
