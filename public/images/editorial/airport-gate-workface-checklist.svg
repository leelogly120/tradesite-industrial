<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Gate-to-work-face terminal checklist</title>
  <desc id="desc">Editorial checklist connecting entry, route, work face and emergency interface inputs.</desc>
  <rect width="1200" height="675" fill="#071923"/>
  <text x="72" y="72" fill="#f4f7f8" font-family="Arial,sans-serif" font-size="32" font-weight="700">GATE-TO-WORK-FACE CHECK</text>
  <text x="72" y="108" fill="#9fb2bb" font-family="Arial,sans-serif" font-size="18">Record current inputs; do not assume access</text>
  <g font-family="Arial,sans-serif">
    <rect x="70" y="172" width="240" height="330" rx="20" fill="#102d39" stroke="#2ed3c6" stroke-width="3"/>
    <text x="105" y="222" fill="#2ed3c6" font-size="24" font-weight="700">01 ENTRY</text>
    <text x="105" y="273" fill="#f4f7f8" font-size="18">permission</text><text x="105" y="309" fill="#f4f7f8" font-size="18">escort</text><text x="105" y="345" fill="#f4f7f8" font-size="18">clear opening</text><text x="105" y="381" fill="#f4f7f8" font-size="18">time window</text>
    <rect x="350" y="172" width="240" height="330" rx="20" fill="#102d39" stroke="#91a8b1" stroke-width="3"/>
    <text x="385" y="222" fill="#c8d7dd" font-size="24" font-weight="700">02 ROUTE</text>
    <text x="385" y="273" fill="#f4f7f8" font-size="18">turns</text><text x="385" y="309" fill="#f4f7f8" font-size="18">floor zones</text><text x="385" y="345" fill="#f4f7f8" font-size="18">public flow</text><text x="385" y="381" fill="#f4f7f8" font-size="18">temporary limits</text>
    <rect x="630" y="172" width="240" height="330" rx="20" fill="#102d39" stroke="#f5b64c" stroke-width="3"/>
    <text x="665" y="222" fill="#f5b64c" font-size="24" font-weight="700">03 WORK FACE</text>
    <text x="665" y="273" fill="#f4f7f8" font-size="18">overhead</text><text x="665" y="309" fill="#f4f7f8" font-size="18">task load</text><text x="665" y="345" fill="#f4f7f8" font-size="18">energy</text><text x="665" y="381" fill="#f4f7f8" font-size="18">segregation</text>
    <rect x="910" y="172" width="220" height="330" rx="20" fill="#102d39" stroke="#f05d5e" stroke-width="3"/>
    <text x="945" y="222" fill="#f49a9b" font-size="24" font-weight="700">04 RESPONSE</text>
    <text x="945" y="273" fill="#f4f7f8" font-size="18">access</text><text x="945" y="309" fill="#f4f7f8" font-size="18">communications</text><text x="945" y="345" fill="#f4f7f8" font-size="18">site owner</text><text x="945" y="381" fill="#f4f7f8" font-size="18">change trigger</text>
  </g>
  <text x="72" y="590" fill="#7f98a2" font-family="Arial,sans-serif" font-size="17">No dimensions, permissions, loads or restrictions are established by this diagram</text>
</svg>
