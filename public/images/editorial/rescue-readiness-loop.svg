<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Equipment-specific rescue-readiness loop</title>
  <desc id="desc">Editorial loop connecting exact equipment information, site plan, named people, practice and review.</desc>
  <rect width="1200" height="675" fill="#071923"/>
  <text x="72" y="72" fill="#f4f7f8" font-family="Arial,sans-serif" font-size="32" font-weight="700">RESCUE-READINESS LOOP</text>
  <text x="72" y="108" fill="#9fb2bb" font-family="Arial,sans-serif" font-size="18">A readiness record is not a rescue procedure</text>
  <circle cx="600" cy="360" r="205" fill="none" stroke="#37515c" stroke-width="18"/>
  <g font-family="Arial,sans-serif">
    <rect x="490" y="140" width="220" height="82" rx="16" fill="#153b45" stroke="#2ed3c6" stroke-width="3"/><text x="525" y="176" fill="#2ed3c6" font-size="19" font-weight="700">EXACT INFORMATION</text><text x="535" y="203" fill="#f4f7f8" font-size="16">manual + procedure</text>
    <rect x="770" y="310" width="245" height="98" rx="16" fill="#243743" stroke="#91a8b1" stroke-width="3"/><text x="809" y="350" fill="#c8d7dd" font-size="19" font-weight="700">NAMED PEOPLE</text><text x="809" y="380" fill="#f4f7f8" font-size="16">roles + alternates</text>
    <rect x="490" y="500" width="220" height="82" rx="16" fill="#3b3020" stroke="#f5b64c" stroke-width="3"/><text x="545" y="536" fill="#f5b64c" font-size="19" font-weight="700">PRACTISE</text><text x="531" y="563" fill="#f4f7f8" font-size="16">record + learn</text>
    <rect x="185" y="310" width="245" height="98" rx="16" fill="#341d25" stroke="#f05d5e" stroke-width="3"/><text x="231" y="350" fill="#f49a9b" font-size="19" font-weight="700">REVIEW CHANGE</text><text x="224" y="380" fill="#f4f7f8" font-size="16">site · crew · equipment</text>
  </g>
  <path d="M738 206 L793 287 M768 485 L714 518 M462 518 L407 438 M407 282 L468 215" stroke="#d7e3e7" stroke-width="5" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 Z" fill="#d7e3e7"/></marker></defs>
</svg>
