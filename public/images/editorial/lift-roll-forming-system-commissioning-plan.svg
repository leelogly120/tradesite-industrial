<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title>COMMISSIONING decision diagram</title>
  <desc>lift-and-roll-forming system commissioning evidence chain. An editorial planning diagram with four decision stages and no equipment specification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F8F7"/><stop offset="1" stop-color="#E5EEF1"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2E6B61"/></marker>
  </defs>
  <rect width="1600" height="900" rx="44" fill="url(#bg)"/>
  <rect x="60" y="54" width="1480" height="792" rx="34" fill="none" stroke="#C5D5D9" stroke-width="4"/>
  <text x="100" y="145" font-family="Arial, sans-serif" font-size="66" font-weight="800" fill="#172A34">COMMISSIONING</text>
  <text x="100" y="218" font-family="Arial, sans-serif" font-size="44" fill="#425E68">Build an evidence chain before operational release</text>
  <text x="1495" y="140" text-anchor="end" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="#2E6B61">ARCLIFT</text>
  <text x="1495" y="205" text-anchor="end" font-family="Arial, sans-serif" font-size="42" fill="#526B73">EDITORIAL DECISION MAP</text>
  <path d="M 250 440 C 320 440, 340 580, 410 580" fill="none" stroke="#2E6B61" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M 610 580 C 680 580, 700 440, 770 440" fill="none" stroke="#2E6B61" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M 970 440 C 1040 440, 1060 580, 1130 580" fill="none" stroke="#2E6B61" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>
  
    <circle cx="150" cy="440" r="96" fill="#FFFFFF" stroke="#2E6B61" stroke-width="12"/>
    <text x="150" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#172A34" data-role="decision-label">Pre-start</text>
    <circle cx="510" cy="580" r="96" fill="#FFFFFF" stroke="#2E6B61" stroke-width="12"/>
    <text x="510" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#172A34" data-role="decision-label">Dry checks</text>
    <circle cx="870" cy="440" r="96" fill="#FFFFFF" stroke="#2E6B61" stroke-width="12"/>
    <text x="870" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#172A34" data-role="decision-label">Trial</text>
    <circle cx="1230" cy="580" r="96" fill="#FFFFFF" stroke="#2E6B61" stroke-width="12"/>
    <text x="1230" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#172A34" data-role="decision-label">Closeout</text>
  <rect x="100" y="750" width="1400" height="58" rx="29" fill="#2E6B61" opacity="0.12"/>
  <text x="800" y="791" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" fill="#273F48">Confirm conditions, responsibilities and open items before release.</text>
</svg>