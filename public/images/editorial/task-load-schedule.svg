<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Blank aerial platform task-load schedule</title>
  <desc id="desc">Editorial table for people, protective equipment, tools, materials, locations and source records.</desc>
  <rect width="1200" height="675" fill="#071923"/>
  <text x="70" y="72" fill="#f4f7f8" font-family="Arial,sans-serif" font-size="32" font-weight="700">TASK-LOAD SCHEDULE</text>
  <text x="70" y="108" fill="#9fb2bb" font-family="Arial,sans-serif" font-size="18">Blank format — no capacity or permitted load is stated</text>
  <rect x="70" y="150" width="1060" height="430" rx="18" fill="#f4f7f8"/>
  <rect x="70" y="150" width="1060" height="66" rx="18" fill="#173844"/>
  <g fill="#f4f7f8" font-family="Arial,sans-serif" font-size="16" font-weight="700">
    <text x="92" y="191">TASK STATE</text><text x="270" y="191">PEOPLE + PPE</text><text x="475" y="191">TOOLS</text><text x="635" y="191">MATERIALS</text><text x="820" y="191">LOCATION</text><text x="970" y="191">SOURCE</text>
  </g>
  <g stroke="#b8c6cc" stroke-width="2"><line x1="70" y1="300" x2="1130" y2="300"/><line x1="70" y1="384" x2="1130" y2="384"/><line x1="70" y1="468" x2="1130" y2="468"/><line x1="70" y1="552" x2="1130" y2="552"/><line x1="250" y1="150" x2="250" y2="580"/><line x1="455" y1="150" x2="455" y2="580"/><line x1="615" y1="150" x2="615" y2="580"/><line x1="800" y1="150" x2="800" y2="580"/><line x1="950" y1="150" x2="950" y2="580"/></g>
  <g fill="#78909a" font-family="Arial,sans-serif" font-size="18"><text x="92" y="268">TBD</text><text x="270" y="268">TBD</text><text x="475" y="268">TBD</text><text x="635" y="268">TBD</text><text x="820" y="268">TBD</text><text x="970" y="268">record/date</text></g>
  <text x="70" y="626" fill="#7f98a2" font-family="Arial,sans-serif" font-size="17">Compare only with exact approved limits for the exact configuration and task state</text>
</svg>
