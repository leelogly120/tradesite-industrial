<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Pick-and-carry crane and spider lift task boundary</title>
  <desc id="desc">A decision path starts with the task, separates material handling from personnel access, then requires site and evidence review.</desc>
  <rect width="1600" height="900" fill="#081826"/>
  <rect x="70" y="72" width="1460" height="756" rx="34" fill="#10283a" stroke="#2f6682" stroke-width="4"/>
  <text x="120" y="155" fill="#eff8fc" font-family="Arial, sans-serif" font-size="58" font-weight="700">Define the task before comparing equipment labels</text>
  <text x="120" y="216" fill="#9fc8db" font-family="Arial, sans-serif" font-size="42">Material handling and personnel access need different evidence paths.</text>
  <g font-family="Arial, sans-serif">
    <rect x="120" y="330" width="290" height="220" rx="28" fill="#173f57" stroke="#78d6df" stroke-width="5"/>
    <text x="160" y="405" fill="#ffffff" font-size="48" font-weight="700" data-role="decision-label">Define task</text>
    <text x="160" y="470" fill="#b9dde7" font-size="42">People or load?</text>
    <text x="160" y="522" fill="#b9dde7" font-size="42">Position or carry?</text>
    <path d="M410 440H490" stroke="#48b7ca" stroke-width="10" stroke-linecap="round"/>
    <path d="M465 415L510 440L465 465" fill="none" stroke="#48b7ca" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="490" y="330" width="300" height="220" rx="28" fill="#26596c" stroke="#f4bb55" stroke-width="5"/>
    <text x="530" y="405" fill="#ffffff" font-size="48" font-weight="700" data-role="decision-label">Choose boundary</text>
    <text x="530" y="470" fill="#ffe0a1" font-size="42">Load handling</text>
    <text x="530" y="522" fill="#ffe0a1" font-size="42">Personnel access</text>
    <path d="M790 440H870" stroke="#48b7ca" stroke-width="10" stroke-linecap="round"/>
    <path d="M845 415L890 440L845 465" fill="none" stroke="#48b7ca" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="870" y="330" width="280" height="220" rx="28" fill="#173f57" stroke="#78d6df" stroke-width="5"/>
    <text x="910" y="405" fill="#ffffff" font-size="48" font-weight="700" data-role="decision-label">Map site</text>
    <text x="910" y="470" fill="#b9dde7" font-size="42">Route / ground</text>
    <text x="910" y="522" fill="#b9dde7" font-size="42">Overhead / zone</text>
    <path d="M1150 440H1230" stroke="#48b7ca" stroke-width="10" stroke-linecap="round"/>
    <path d="M1205 415L1250 440L1205 465" fill="none" stroke="#48b7ca" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1230" y="330" width="250" height="220" rx="28" fill="#173f57" stroke="#78d6df" stroke-width="5"/>
    <text x="1270" y="405" fill="#ffffff" font-size="48" font-weight="700" data-role="decision-label">Verify</text>
    <text x="1270" y="470" fill="#b9dde7" font-size="42">Documents</text>
    <text x="1270" y="522" fill="#b9dde7" font-size="42">and owner</text>
  </g>
  <rect x="120" y="660" width="1360" height="105" rx="18" fill="#0a1d2c" stroke="#2f6682" stroke-width="3"/>
  <text x="155" y="724" fill="#d7ebf3" font-family="Arial, sans-serif" font-size="42">Hold the decision when the task crosses categories or any controlling evidence is missing.</text>
  <text x="1390" y="802" fill="#78d6df" font-family="Arial, sans-serif" font-size="42" font-weight="700">ARCLIFT</text>
</svg>
