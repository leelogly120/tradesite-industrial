<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Ceiling maintenance pre-task information checklist</title>
  <desc id="desc">Five information gates connect the task, route, support, overhead and rescue records before an access review can proceed.</desc>
  <rect width="1600" height="900" fill="#081826"/>
  <rect x="70" y="72" width="1460" height="756" rx="34" fill="#10283a" stroke="#2f6682" stroke-width="4"/>
  <text x="120" y="155" fill="#eff8fc" font-family="Arial, sans-serif" font-size="58" font-weight="700">A checklist records evidence; it does not authorize work</text>
  <text x="120" y="216" fill="#9fc8db" font-family="Arial, sans-serif" font-size="42">Assign an owner, source, status and hold point to every pre-task input.</text>
  <path d="M220 470H1380" fill="none" stroke="#48b7ca" stroke-width="10" stroke-linecap="round"/>
  <path d="M1355 445L1400 470L1355 495" fill="none" stroke="#48b7ca" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g><circle cx="220" cy="470" r="92" fill="#173f57" stroke="#78d6df" stroke-width="5"/><text x="220" y="462" fill="#ffffff" font-size="46" font-weight="700" data-role="decision-label">Task</text><text x="220" y="520" fill="#b9dde7" font-size="42">scope</text></g>
    <g><circle cx="510" cy="470" r="92" fill="#173f57" stroke="#78d6df" stroke-width="5"/><text x="510" y="462" fill="#ffffff" font-size="46" font-weight="700" data-role="decision-label">Route</text><text x="510" y="520" fill="#b9dde7" font-size="42">access</text></g>
    <g><circle cx="800" cy="470" r="92" fill="#173f57" stroke="#78d6df" stroke-width="5"/><text x="800" y="462" fill="#ffffff" font-size="46" font-weight="700" data-role="decision-label">Support</text><text x="800" y="520" fill="#b9dde7" font-size="42">surface</text></g>
    <g><circle cx="1090" cy="470" r="92" fill="#26596c" stroke="#f4bb55" stroke-width="5"/><text x="1090" y="462" fill="#ffffff" font-size="46" font-weight="700" data-role="decision-label">Overhead</text><text x="1090" y="520" fill="#ffe0a1" font-size="42">clearance</text></g>
    <g><circle cx="1380" cy="470" r="92" fill="#173f57" stroke="#78d6df" stroke-width="5"/><text x="1380" y="462" fill="#ffffff" font-size="46" font-weight="700" data-role="decision-label">Rescue</text><text x="1380" y="520" fill="#b9dde7" font-size="42">readiness</text></g>
  </g>
  <rect x="120" y="660" width="1360" height="105" rx="18" fill="#0a1d2c" stroke="#2f6682" stroke-width="3"/>
  <text x="155" y="724" fill="#d7ebf3" font-family="Arial, sans-serif" font-size="42">Missing or stale input means review hold, named follow-up and controlled recheck.</text>
  <text x="1390" y="802" fill="#78d6df" font-family="Arial, sans-serif" font-size="42" font-weight="700">ARCLIFT</text>
</svg>
