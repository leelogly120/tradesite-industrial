<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title>Indoor floor load review</title>
  <desc>ARCLIFT editorial diagram linking machine, contact area, route, floor, and protection questions.</desc>
  <rect width="1600" height="900" fill="#f4f7f8"/>
  <rect x="70" y="65" width="1460" height="770" rx="34" fill="#fff" stroke="#123c4a" stroke-width="8"/>
  <text x="120" y="155" font-family="Arial, sans-serif" font-size="62" font-weight="700" fill="#123c4a">ARCLIFT FLOOR REVIEW</text>
  <text x="120" y="225" font-family="Arial, sans-serif" font-size="48" fill="#41636d">Connect each machine state to a location and reviewer</text>
  <g font-family="Arial, sans-serif" font-size="48" font-weight="700" text-anchor="middle" fill="#123c4a">
    <rect x="100" y="330" width="260" height="220" rx="26" fill="#e9f2f4" stroke="#123c4a" stroke-width="6"/><text data-role="decision-label" x="230" y="455" font-size="48">MACHINE</text>
    <rect x="385" y="330" width="260" height="220" rx="26" fill="#f8eee7" stroke="#123c4a" stroke-width="6"/><text data-role="decision-label" x="515" y="455" font-size="48">CONTACT AREA</text>
    <rect x="670" y="330" width="260" height="220" rx="26" fill="#e9f2f4" stroke="#123c4a" stroke-width="6"/><text data-role="decision-label" x="800" y="455" font-size="48">ROUTE</text>
    <rect x="955" y="330" width="260" height="220" rx="26" fill="#f8eee7" stroke="#123c4a" stroke-width="6"/><text data-role="decision-label" x="1085" y="455" font-size="48">FLOOR</text>
    <rect x="1240" y="330" width="260" height="220" rx="26" fill="#e9f2f4" stroke="#123c4a" stroke-width="6"/><text data-role="decision-label" x="1370" y="455" font-size="48">PROTECTION</text>
  </g>
  <g stroke="#e07132" stroke-width="16" stroke-linecap="round">
    <path d="M360 440 H385"/><path d="M645 440 H670"/><path d="M930 440 H955"/><path d="M1215 440 H1240"/>
  </g>
  <text x="800" y="660" font-family="Arial, sans-serif" font-size="48" text-anchor="middle" fill="#123c4a">STATE + LOCATION + LOAD PATH + RESPONSIBILITY</text>
  <rect x="120" y="725" width="1360" height="65" rx="16" fill="#123c4a"/>
  <text x="800" y="772" font-family="Arial, sans-serif" font-size="48" text-anchor="middle" fill="#fff">EDITORIAL MAP — NOT A STRUCTURAL APPROVAL</text>
</svg>
