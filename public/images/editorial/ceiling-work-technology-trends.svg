<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Ceiling work technology evidence chain</title>
  <desc id="desc">A technology label moves through interface, evidence, site verification and decision ownership before it can affect selection.</desc>
  <rect width="1600" height="900" fill="#081826"/>
  <rect x="70" y="72" width="1460" height="756" rx="34" fill="#10283a" stroke="#2f6682" stroke-width="4"/>
  <text x="120" y="155" fill="#eff8fc" font-family="Arial, sans-serif" font-size="58" font-weight="700">Turn a technology label into a verifiable decision</text>
  <text x="120" y="216" fill="#9fc8db" font-family="Arial, sans-serif" font-size="42">A feature matters only through its interfaces, records, site conditions and owner.</text>
  <g font-family="Arial, sans-serif">
    <rect x="120" y="330" width="245" height="220" rx="28" fill="#173f57" stroke="#78d6df" stroke-width="5"/>
    <text x="158" y="405" fill="#ffffff" font-size="46" font-weight="700" data-role="decision-label">Feature</text>
    <text x="158" y="470" fill="#b9dde7" font-size="42">Exact scope</text>
    <text x="158" y="522" fill="#b9dde7" font-size="42">and limits</text>
    <path d="M365 440H430" stroke="#48b7ca" stroke-width="10" stroke-linecap="round"/><path d="M405 415L450 440L405 465" fill="none" stroke="#48b7ca" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="430" y="330" width="245" height="220" rx="28" fill="#173f57" stroke="#78d6df" stroke-width="5"/>
    <text x="468" y="405" fill="#ffffff" font-size="46" font-weight="700" data-role="decision-label">Interface</text>
    <text x="468" y="470" fill="#b9dde7" font-size="42">Control / power</text>
    <text x="468" y="522" fill="#b9dde7" font-size="42">route / task</text>
    <path d="M675 440H740" stroke="#48b7ca" stroke-width="10" stroke-linecap="round"/><path d="M715 415L760 440L715 465" fill="none" stroke="#48b7ca" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="740" y="330" width="245" height="220" rx="28" fill="#26596c" stroke="#f4bb55" stroke-width="5"/>
    <text x="778" y="405" fill="#ffffff" font-size="46" font-weight="700" data-role="decision-label">Evidence</text>
    <text x="778" y="470" fill="#ffe0a1" font-size="42">Current source</text>
    <text x="778" y="522" fill="#ffe0a1" font-size="42">and revision</text>
    <path d="M985 440H1050" stroke="#48b7ca" stroke-width="10" stroke-linecap="round"/><path d="M1025 415L1070 440L1025 465" fill="none" stroke="#48b7ca" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1050" y="330" width="245" height="220" rx="28" fill="#173f57" stroke="#78d6df" stroke-width="5"/>
    <text x="1088" y="405" fill="#ffffff" font-size="46" font-weight="700" data-role="decision-label">Site check</text>
    <text x="1088" y="470" fill="#b9dde7" font-size="42">Real conditions</text>
    <text x="1088" y="522" fill="#b9dde7" font-size="42">and conflicts</text>
    <path d="M1295 440H1340" stroke="#48b7ca" stroke-width="10" stroke-linecap="round"/><path d="M1315 415L1360 440L1315 465" fill="none" stroke="#48b7ca" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1340" y="330" width="140" height="220" rx="28" fill="#173f57" stroke="#78d6df" stroke-width="5"/>
    <text x="1410" y="405" fill="#ffffff" font-size="46" font-weight="700" text-anchor="middle" data-role="decision-label">Owner</text>
    <text x="1410" y="470" fill="#b9dde7" font-size="42" text-anchor="middle">signs</text>
    <text x="1410" y="522" fill="#b9dde7" font-size="42" text-anchor="middle">decision</text>
  </g>
  <rect x="120" y="660" width="1360" height="105" rx="18" fill="#0a1d2c" stroke="#2f6682" stroke-width="3"/>
  <text x="155" y="724" fill="#d7ebf3" font-family="Arial, sans-serif" font-size="42">No evidence chain, no trend claim: keep the feature provisional and the selection open.</text>
  <text x="1390" y="802" fill="#78d6df" font-family="Arial, sans-serif" font-size="42" font-weight="700">ARCLIFT</text>
</svg>
