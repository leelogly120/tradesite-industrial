<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Blank coil data card</title>
  <desc id="desc">A fictional planning card lists geometry, packaging, surface, identification and handling fields without values.</desc>
  <rect width="1200" height="675" fill="#f8f2e9"/>
  <rect x="95" y="55" width="1010" height="565" rx="22" fill="#fff" stroke="#334e68" stroke-width="4"/>
  <text x="140" y="120" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#334e68">INCOMING COIL DATA CARD</text>
  <g font-family="Arial,sans-serif" font-size="22" fill="#334e68">
    <text x="145" y="205">GEOMETRY</text><text x="625" y="205">PACKAGING / EYE</text>
    <text x="145" y="350">SURFACE / EDGE</text><text x="625" y="350">IDENTIFICATION</text>
  </g>
  <g stroke="#a9b7c2" stroke-width="3"><path d="M145 230h350"/><path d="M625 230h350"/><path d="M145 375h350"/><path d="M625 375h350"/></g>
  <g font-family="Arial,sans-serif" font-size="17" fill="#718291">
    <text x="145" y="265">width • ID • OD • mass</text><text x="625" y="265">orientation • restraint • wrap</text>
    <text x="145" y="410">protection • damage status</text><text x="625" y="410">anonymised lot • revision</text>
  </g>
  <rect x="145" y="485" width="830" height="75" rx="12" fill="#eaf1f5"/>
  <text x="180" y="532" font-family="Arial,sans-serif" font-size="21" fill="#334e68">VALUES COME FROM CONTROLLED BUYER RECORDS — NOT THIS DIAGRAM</text>
</svg>
