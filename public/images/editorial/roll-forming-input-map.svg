<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img">
<title>Roll-forming line project input map</title>
<desc>Five concise editorial inputs feeding a project-specific roll-forming configuration review.</desc>
<defs><style>.bg{fill:#071a2f}.panel{fill:#0d2a4a;stroke:#345c7c;stroke-width:3}.blue{fill:#123b63}.red{fill:#d62932}.white{fill:#fff}.muted{fill:#b8cad9}.line{stroke:#66839d;stroke-width:7;fill:none;stroke-linecap:round}.accent{stroke:#d62932;stroke-width:10;fill:none;stroke-linecap:round}</style></defs>
<rect class="bg" width="1600" height="900"/>
<rect class="red" x="76" y="66" width="12" height="112" rx="6"/>
<text x="120" y="124" fill="#fff" font-family="Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="2">ROLL-FORMING INPUT MAP</text>
<text x="120" y="178" fill="#b8cad9" font-family="Arial, sans-serif" font-size="48">Five inputs shape the configuration review.</text>
<path class="line" d="M290 410L690 465M800 410V435M1310 410L910 465M545 690L720 555M1055 690L880 555"/>
<g transform="translate(90 250)"><rect class="panel" width="400" height="160" rx="24"/><circle class="red" cx="62" cy="62" r="34"/><text x="62" y="78" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="48" font-weight="700">1</text><text data-role="decision-label" x="210" y="102" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="56" font-weight="700">PROFILE</text></g>
<g transform="translate(600 250)"><rect class="panel" width="400" height="160" rx="24"/><circle class="red" cx="62" cy="62" r="34"/><text x="62" y="78" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="48" font-weight="700">2</text><text data-role="decision-label" x="220" y="102" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="56" font-weight="700">MATERIAL</text></g>
<g transform="translate(1110 250)"><rect class="panel" width="400" height="160" rx="24"/><circle class="red" cx="62" cy="62" r="34"/><text x="62" y="78" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="48" font-weight="700">3</text><text data-role="decision-label" x="225" y="102" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="54" font-weight="700">COIL + FEED</text></g>
<g transform="translate(345 610)"><rect class="panel" width="400" height="160" rx="24"/><circle class="red" cx="62" cy="62" r="34"/><text x="62" y="78" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="48" font-weight="700">4</text><text data-role="decision-label" x="230" y="92" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="50" font-weight="700">POWER +</text><text x="230" y="142" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="50" font-weight="700">CONTROLS</text></g>
<g transform="translate(855 610)"><rect class="panel" width="400" height="160" rx="24"/><circle class="red" cx="62" cy="62" r="34"/><text x="62" y="78" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="48" font-weight="700">5</text><text data-role="decision-label" x="230" y="92" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="50" font-weight="700">SITE</text><text x="230" y="142" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="50" font-weight="700">WORKFLOW</text></g>
<circle class="blue" cx="800" cy="500" r="118"/><circle class="red" cx="800" cy="500" r="82"/><text x="800" y="488" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="48" font-weight="700">CONFIG</text><text x="800" y="546" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="48" font-weight="700">REVIEW</text>
<text x="90" y="845" fill="#b8cad9" font-family="Arial, sans-serif" font-size="48">Output remains project-specific.</text><text x="1280" y="845" fill="#fff" font-family="Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="2">ARCLIFT</text>
</svg>
