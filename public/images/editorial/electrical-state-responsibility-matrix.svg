<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">State and responsibility matrix</title>
  <desc id="desc">A blank matrix pairs operating states with signal, response, reset and approval-owner fields.</desc>
  <rect width="1200" height="675" fill="#eef5f4"/>
  <text x="65" y="85" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#1f4b49">STATE + SIGNAL + OWNER</text>
  <rect x="65" y="140" width="1070" height="420" rx="18" fill="#fff" stroke="#2e6f6a" stroke-width="4"/>
  <g stroke="#9db8b5" stroke-width="3"><path d="M65 225h1070"/><path d="M65 310h1070"/><path d="M65 395h1070"/><path d="M65 480h1070"/><path d="M300 140v420"/><path d="M520 140v420"/><path d="M750 140v420"/><path d="M950 140v420"/></g>
  <g font-family="Arial,sans-serif" font-size="20" fill="#1f4b49" font-weight="700"><text x="95" y="195">STATE</text><text x="340" y="195">SIGNAL</text><text x="560" y="195">RESPONSE</text><text x="790" y="195">RESET</text><text x="985" y="195">OWNER</text></g>
  <g font-family="Arial,sans-serif" font-size="19" fill="#6b807e"><text x="95" y="280">normal stop</text><text x="95" y="365">safeguard event</text><text x="95" y="450">energy isolation</text><text x="95" y="535">fault / recovery</text></g>
  <text x="65" y="620" font-family="Arial,sans-serif" font-size="20" fill="#1f4b49">Rows are prompts only; the approved risk and electrical documents define actual functions.</text>
</svg>
