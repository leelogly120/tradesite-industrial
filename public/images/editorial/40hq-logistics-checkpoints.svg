<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img">
<title>Forty-foot high-cube logistics review checkpoints</title>
<desc>Five concise editorial checkpoints for configuration, packing, lifting, container review, and destination arrival.</desc>
<defs><style>.bg{fill:#071a2f}.panel{fill:#0d2a4a;stroke:#345c7c;stroke-width:3}.red{fill:#d62932}.white{fill:#fff}.muted{fill:#b8cad9}.route{stroke:#d62932;stroke-width:10;fill:none;stroke-linecap:round}</style></defs>
<rect class="bg" width="1600" height="900"/>
<rect class="red" x="76" y="66" width="12" height="112" rx="6"/>
<text x="120" y="124" fill="#fff" font-family="Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="2">40HQ LOGISTICS CHECKPOINTS</text>
<text x="120" y="174" fill="#b8cad9" font-family="Arial, sans-serif" font-size="44">Compatibility follows review, not imagery.</text>
<path class="route" d="M290 350H1310M800 430V505M555 595H1045"/>
<g transform="translate(90 250)"><rect class="panel" width="400" height="190" rx="24"/><circle class="red" cx="62" cy="62" r="38"/><text x="62" y="77" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="46" font-weight="700">1</text><text data-role="decision-label" x="200" y="128" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="56" font-weight="700">CONFIG LOCK</text></g>
<g transform="translate(600 250)"><rect class="panel" width="400" height="190" rx="24"/><circle class="red" cx="62" cy="62" r="38"/><text x="62" y="77" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="46" font-weight="700">2</text><text data-role="decision-label" x="200" y="128" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="56" font-weight="700">PACK MAP</text></g>
<g transform="translate(1110 250)"><rect class="panel" width="400" height="190" rx="24"/><circle class="red" cx="62" cy="62" r="38"/><text x="62" y="77" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="46" font-weight="700">3</text><text data-role="decision-label" x="200" y="128" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="56" font-weight="700">LIFT PLAN</text></g>
<g transform="translate(345 505)"><rect class="panel" width="400" height="190" rx="24"/><circle class="red" cx="62" cy="62" r="38"/><text x="62" y="77" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="46" font-weight="700">4</text><text data-role="decision-label" x="200" y="128" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="56" font-weight="700">CONTAINER</text></g>
<g transform="translate(855 505)"><rect class="panel" width="400" height="190" rx="24"/><circle class="red" cx="62" cy="62" r="38"/><text x="62" y="77" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="46" font-weight="700">5</text><text data-role="decision-label" x="200" y="128" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="56" font-weight="700">ARRIVAL</text></g>
<rect class="red" x="90" y="754" width="1060" height="80" rx="18"/><text x="130" y="809" fill="#fff" font-family="Arial, sans-serif" font-size="46" font-weight="700">Container fit requires project review.</text>
<g transform="translate(1300 780)"><rect class="red" width="42" height="42" rx="6"/><path d="M11 30L21 10L31 30H25L21 22L17 30Z" fill="#fff"/><text x="58" y="33" fill="#fff" font-family="Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="2">ARCLIFT</text></g>
</svg>
