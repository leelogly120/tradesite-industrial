<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Editorial reference chain from a project datum through forming outlet and eave to roof coordinates">
  <title>ROOF-ZONE reference diagram</title>
  <desc>Four unscaled editorial reference cards for datum, forming outlet, eave and roof coordinates. Personnel working height remains a separate definition.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F9F8"/>
      <stop offset="1" stop-color="#E5EEF1"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#126E82"/>
    </marker>
  </defs>
  <rect width="1600" height="900" rx="44" fill="url(#bg)"/>
  <rect x="60" y="54" width="1480" height="792" rx="34" fill="none" stroke="#C5D5D9" stroke-width="4"/>
  <text x="100" y="140" font-family="Arial, sans-serif" font-size="64" font-weight="800" fill="#172A34">ROOF-ZONE REFERENCES</text>
  <text x="1495" y="138" text-anchor="end" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="#126E82">ARCLIFT</text>
  <text x="800" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" fill="#425E68">Project datum → outlet reference → eave point → roof coordinates</text>

  <path d="M410 465 H445" stroke="#126E82" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M780 465 H815" stroke="#126E82" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1150 465 H1185" stroke="#126E82" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="80" y="340" width="330" height="250" rx="32" fill="#FFFFFF" stroke="#126E82" stroke-width="8"/>
  <rect x="450" y="340" width="330" height="250" rx="32" fill="#FFFFFF" stroke="#126E82" stroke-width="8"/>
  <rect x="820" y="340" width="330" height="250" rx="32" fill="#FFFFFF" stroke="#126E82" stroke-width="8"/>
  <rect x="1190" y="340" width="330" height="250" rx="32" fill="#FFFFFF" stroke="#126E82" stroke-width="8"/>

  <circle cx="245" cy="410" r="34" fill="#126E82"/>
  <circle cx="615" cy="410" r="34" fill="#126E82"/>
  <circle cx="985" cy="410" r="34" fill="#126E82"/>
  <circle cx="1355" cy="410" r="34" fill="#126E82"/>
  <text x="245" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF">1</text>
  <text x="615" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF">2</text>
  <text x="985" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF">3</text>
  <text x="1355" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF">4</text>
  <text x="245" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#172A34" data-role="decision-label">DATUM</text>
  <text x="615" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#172A34" data-role="decision-label">OUTLET</text>
  <text x="985" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#172A34" data-role="decision-label">EAVE</text>
  <text x="1355" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#172A34" data-role="decision-label">ROOF</text>

  <rect x="100" y="720" width="1400" height="82" rx="28" fill="#126E82" opacity="0.12"/>
  <text x="800" y="776" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" fill="#273F48">Personnel working height remains a separate controlled definition.</text>
</svg>
