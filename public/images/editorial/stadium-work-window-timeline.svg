<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Placeholder stadium maintenance window timeline</title>
  <desc id="desc">Editorial timeline distinguishing event, changeover and isolated maintenance states.</desc>
  <rect width="1200" height="675" fill="#071923"/>
  <text x="72" y="76" fill="#f4f7f8" font-family="Arial,sans-serif" font-size="32" font-weight="700">WORK-WINDOW PLACEHOLDER</text>
  <text x="72" y="112" fill="#9fb2bb" font-family="Arial,sans-serif" font-size="18">Actual windows require venue-owner approval</text>
  <line x1="112" y1="346" x2="1088" y2="346" stroke="#37515c" stroke-width="10" stroke-linecap="round"/>
  <rect x="112" y="244" width="270" height="170" rx="18" fill="#153342" stroke="#f05d5e" stroke-width="3"/>
  <text x="145" y="294" fill="#f05d5e" font-family="Arial,sans-serif" font-size="22" font-weight="700">EVENT STATE</text>
  <text x="145" y="332" fill="#f4f7f8" font-family="Arial,sans-serif" font-size="18">occupied boundary</text>
  <text x="145" y="365" fill="#f4f7f8" font-family="Arial,sans-serif" font-size="18">work assumption: HOLD</text>
  <rect x="465" y="244" width="270" height="170" rx="18" fill="#153342" stroke="#f5b64c" stroke-width="3"/>
  <text x="498" y="294" fill="#f5b64c" font-family="Arial,sans-serif" font-size="22" font-weight="700">CHANGEOVER</text>
  <text x="498" y="332" fill="#f4f7f8" font-family="Arial,sans-serif" font-size="18">temporary routes</text>
  <text x="498" y="365" fill="#f4f7f8" font-family="Arial,sans-serif" font-size="18">interfaces: RECHECK</text>
  <rect x="818" y="244" width="270" height="170" rx="18" fill="#153342" stroke="#2ed3c6" stroke-width="3"/>
  <text x="851" y="294" fill="#2ed3c6" font-family="Arial,sans-serif" font-size="22" font-weight="700">ISOLATED WORK</text>
  <text x="851" y="332" fill="#f4f7f8" font-family="Arial,sans-serif" font-size="18">controlled access</text>
  <text x="851" y="365" fill="#f4f7f8" font-family="Arial,sans-serif" font-size="18">review state: OPEN</text>
  <path d="M382 346 H465 M735 346 H818" stroke="#d7e3e7" stroke-width="5" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 Z" fill="#d7e3e7"/></marker></defs>
  <text x="72" y="580" fill="#c8d7dd" font-family="Arial,sans-serif" font-size="19">Record owner · approval reference · start/finish boundary · change trigger</text>
</svg>
