<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Truck integration responsibility swimlane</title>
  <desc id="desc">A generic coordination map separates buyer, vehicle supplier, integrator, equipment supplier and local-authority questions.</desc>
  <rect width="1200" height="675" fill="#edf2f6"/>
  <text x="60" y="80" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#243d52">MAP RESPONSIBILITY BEFORE INTEGRATION</text>
  <g font-family="Arial,sans-serif" font-size="19">
    <g fill="#243d52"><rect x="60" y="135" width="240" height="80"/><rect x="60" y="225" width="240" height="80"/><rect x="60" y="315" width="240" height="80"/><rect x="60" y="405" width="240" height="80"/><rect x="60" y="495" width="240" height="80"/></g>
    <g fill="#fff"><text x="80" y="183">PROJECT OWNER</text><text x="80" y="273">VEHICLE SUPPLIER</text><text x="80" y="363">INTEGRATOR</text><text x="80" y="453">EQUIPMENT SUPPLIER</text><text x="80" y="543">LOCAL REVIEW</text></g>
    <g fill="#fff" stroke="#93a8b8" stroke-width="2"><rect x="320" y="135" width="810" height="80"/><rect x="320" y="225" width="810" height="80"/><rect x="320" y="315" width="810" height="80"/><rect x="320" y="405" width="810" height="80"/><rect x="320" y="495" width="810" height="80"/></g>
    <g fill="#536879"><text x="350" y="183">use case • route • acceptance owner</text><text x="350" y="273">controlled chassis data • build status</text><text x="350" y="363">attachment • calculations • final documentation</text><text x="350" y="453">module interface data • controlled revisions</text><text x="350" y="543">destination rules • inspection • registration path</text></g>
  </g>
</svg>
