  <rect width="1200" height="675" fill="#f5f2e9"/>
  <text x="60" y="82" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#3a493f">ONE VEHICLE — MULTIPLE ROUTE REVIEWS</text>
  <path d="M85 490C260 210 390 510 565 300s300 160 550-80" fill="none" stroke="#677b6b" stroke-width="42" stroke-linecap="round"/>
  <path d="M85 490C260 210 390 510 565 300s300 160 550-80" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="18 18"/>
  <g fill="#d56e43" stroke="#fff" stroke-width="5"><circle cx="115" cy="445" r="28"/><circle cx="345" cy="367" r="28"/><circle cx="565" cy="300" r="28"/><circle cx="825" cy="319" r="28"/><circle cx="1085" cy="233" r="28"/></g>
