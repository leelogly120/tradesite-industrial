<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Profile coil and sample decision map</title>
  <desc id="desc">Three controlled inputs lead to a project tooling review while unknown design outputs remain reserved.</desc>
  <rect width="1200" height="675" fill="#eef4f2"/>
  <text x="70" y="85" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#153c3b">FROM INPUTS TO A TOOLING REVIEW</text>
  <g font-family="Arial,sans-serif">
    <g fill="#fff" stroke="#2b6b68" stroke-width="4">
      <rect x="70" y="155" width="270" height="150" rx="18"/><rect x="70" y="355" width="270" height="150" rx="18"/>
      <rect x="465" y="255" width="270" height="150" rx="18"/><rect x="860" y="255" width="270" height="150" rx="18"/>
    </g>
    <g fill="#153c3b" font-size="25" font-weight="700">
      <text x="115" y="215">PROFILE</text><text x="115" y="415">COIL + SAMPLE</text>
      <text x="510" y="315">CONTROLLED</text><text x="510" y="350">INPUT RECORD</text>
      <text x="900" y="315">PROJECT TOOLING</text><text x="900" y="350">REVIEW</text>
    </g>
    <g fill="#657b7a" font-size="18"><text x="115" y="250">revision • geometry</text><text x="115" y="450">status • evidence</text><text x="900" y="390">not a capability promise</text></g>
  </g>
  <g fill="none" stroke="#d97745" stroke-width="8"><path d="M340 230h105l20 90"/><path d="M340 430h105l20-90"/><path d="M735 330h125"/></g>
  <text x="70" y="590" font-family="Arial,sans-serif" font-size="22" fill="#153c3b">Tooling, stations, pass schedule, tolerance, speed and outcome remain unknown until signed review.</text>
</svg>
