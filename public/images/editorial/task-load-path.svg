<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Task load path without equipment depiction</title>
  <desc id="desc">Editorial workflow showing controlled receipt, staging, transfer, work state and removal.</desc>
  <rect width="1200" height="675" fill="#071923"/>
  <text x="72" y="72" fill="#f4f7f8" font-family="Arial,sans-serif" font-size="32" font-weight="700">TASK-LOAD PATH</text>
  <text x="72" y="108" fill="#9fb2bb" font-family="Arial,sans-serif" font-size="18">Every transfer method and permission remains project-specific</text>
  <path d="M130 340 H1070" stroke="#37515c" stroke-width="10"/>
  <g font-family="Arial,sans-serif">
    <circle cx="150" cy="340" r="72" fill="#153b45" stroke="#2ed3c6" stroke-width="4"/><text x="111" y="332" fill="#2ed3c6" font-size="18" font-weight="700">RECEIVE</text><text x="115" y="360" fill="#f4f7f8" font-size="16">identify</text>
    <circle cx="450" cy="340" r="72" fill="#243743" stroke="#91a8b1" stroke-width="4"/><text x="416" y="332" fill="#c8d7dd" font-size="18" font-weight="700">STAGE</text><text x="406" y="360" fill="#f4f7f8" font-size="16">secure + count</text>
    <circle cx="750" cy="340" r="72" fill="#3b3020" stroke="#f5b64c" stroke-width="4"/><text x="712" y="332" fill="#f5b64c" font-size="18" font-weight="700">TASK</text><text x="701" y="360" fill="#f4f7f8" font-size="16">state + location</text>
    <circle cx="1050" cy="340" r="72" fill="#341d25" stroke="#f05d5e" stroke-width="4"/><text x="1008" y="332" fill="#f49a9b" font-size="18" font-weight="700">REMOVE</text><text x="1007" y="360" fill="#f4f7f8" font-size="16">account + exit</text>
  </g>
  <path d="M230 340 H360 M530 340 H660 M830 340 H960" stroke="#d7e3e7" stroke-width="5" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 Z" fill="#d7e3e7"/></marker></defs>
  <text x="72" y="540" fill="#f4f7f8" font-family="Arial,sans-serif" font-size="19">Record quantity · combined state · position · attachment · transfer owner · change trigger</text>
  <text x="72" y="582" fill="#7f98a2" font-family="Arial,sans-serif" font-size="17">This diagram does not state that any platform may hoist, carry, travel with or transfer a load</text>
</svg>
