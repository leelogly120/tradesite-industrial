<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img">
<title>Roof-level roll-forming workflow planning diagram</title>
<desc>A five-stage editorial workflow from project inputs through a reviewed roof-level work brief.</desc>
<defs><style>
.bg{fill:#071a2f}.panel{fill:#0d2a4a;stroke:#315575;stroke-width:2}.panel2{fill:#123b63}.red{fill:#d62932}.white{fill:#fff}.muted{fill:#a9bed1}.line{stroke:#d62932;stroke-width:8;fill:none}.thin{stroke:#66839d;stroke-width:3;fill:none}.h1{font:700 54px Arial,sans-serif;letter-spacing:2px}.h2{font:700 25px Arial,sans-serif}.body{font:400 20px Arial,sans-serif}.small{font:600 16px Arial,sans-serif;letter-spacing:1.5px}.num{font:700 28px Arial,sans-serif}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d62932"/></marker></defs>
<rect class="bg" width="1600" height="900"/><rect class="red" x="72" y="76" width="12" height="92" rx="6"/>
<text class="white h1" x="116" y="126">ROOF-LEVEL WORKFLOW</text><text class="muted body" x="116" y="164">Plan the interfaces before equipment selection and mobilization.</text>
<path class="line" d="M262 389H1338" marker-end="url(#arrow)"/>
<g transform="translate(90 260)"><rect class="panel" width="250" height="250" rx="22"/><circle class="red" cx="46" cy="48" r="28"/><text class="white num" x="46" y="58" text-anchor="middle">1</text><text class="white h2" x="30" y="112">PROJECT INPUTS</text><text class="muted body" x="30" y="154">Profile and material</text><text class="muted body" x="30" y="188">Panel handling intent</text><text class="muted body" x="30" y="222">Destination needs</text></g>
<g transform="translate(382 260)"><rect class="panel" width="250" height="250" rx="22"/><circle class="red" cx="46" cy="48" r="28"/><text class="white num" x="46" y="58" text-anchor="middle">2</text><text class="white h2" x="30" y="112">SITE REVIEW</text><text class="muted body" x="30" y="154">Ground and access</text><text class="muted body" x="30" y="188">Lift route and slope</text><text class="muted body" x="30" y="222">Weather constraints</text></g>
<g transform="translate(674 260)"><rect class="panel2" width="250" height="250" rx="22"/><circle class="red" cx="46" cy="48" r="28"/><text class="white num" x="46" y="58" text-anchor="middle">3</text><text class="white h2" x="30" y="112">CONFIGURATION</text><text class="muted body" x="30" y="154">Carrier and support</text><text class="muted body" x="30" y="188">Feed-path concept</text><text class="muted body" x="30" y="222">Power and controls</text></g>
<g transform="translate(966 260)"><rect class="panel" width="250" height="250" rx="22"/><circle class="red" cx="46" cy="48" r="28"/><text class="white num" x="46" y="58" text-anchor="middle">4</text><text class="white h2" x="30" y="112">METHOD PLAN</text><text class="muted body" x="30" y="154">Sequence and roles</text><text class="muted body" x="30" y="188">Exclusion zones</text><text class="muted body" x="30" y="222">Contingency points</text></g>
<g transform="translate(1258 260)"><rect class="panel" width="250" height="250" rx="22"/><circle class="red" cx="46" cy="48" r="28"/><text class="white num" x="46" y="58" text-anchor="middle">5</text><text class="white h2" x="30" y="112">WORK BRIEF</text><text class="muted body" x="30" y="154">Reviewed interfaces</text><text class="muted body" x="30" y="188">Open assumptions</text><text class="muted body" x="30" y="222">Decision record</text></g>
<rect class="panel" x="90" y="596" width="1418" height="156" rx="20"/><text class="red small" x="126" y="640">RELEASE GATE</text><text class="white h2" x="126" y="686">Confirm site facts, responsibilities, and handling interfaces before the workflow is released.</text><text class="muted body" x="126" y="724">This diagram supports planning; it does not establish project suitability.</text>
<g transform="translate(1320 806)"><rect class="red" width="34" height="34" rx="5"/><path d="M9 24L17 9L25 24H20L17 18L14 24Z" fill="#fff"/><text class="white small" x="48" y="24">ARCLIFT</text></g>
</svg>
