<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Aerial platform familiarization and handover decision path</title>
  <desc id="desc">Five controlled steps connect role checks, machine information, supervised familiarization, authorization, and change review.</desc>
  <rect width="1600" height="900" fill="#081826"/>
  <rect x="70" y="72" width="1460" height="756" rx="34" fill="#10283a" stroke="#2f6682" stroke-width="4"/>
  <text x="120" y="155" fill="#eff8fc" font-family="Arial, sans-serif" font-size="58" font-weight="700">Familiarization is a controlled handover</text>
  <text x="120" y="216" fill="#9fc8db" font-family="Arial, sans-serif" font-size="42">Training remains separate. The specific machine and named user still need a traceable decision.</text>
  <path d="M245 490H1360" fill="none" stroke="#48b7ca" stroke-width="10" stroke-linecap="round"/>
  <path d="M1335 465L1380 490L1335 515" fill="none" stroke="#48b7ca" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g>
      <circle cx="235" cy="490" r="92" fill="#173f57" stroke="#78d6df" stroke-width="5"/>
      <text x="235" y="480" fill="#ffffff" font-size="46" font-weight="700" data-role="decision-label">Roles</text>
      <text x="235" y="535" fill="#b9dde7" font-size="42">verified</text>
    </g>
    <g>
      <circle cx="510" cy="490" r="92" fill="#173f57" stroke="#78d6df" stroke-width="5"/>
      <text x="510" y="480" fill="#ffffff" font-size="46" font-weight="700" data-role="decision-label">Machine</text>
      <text x="510" y="535" fill="#b9dde7" font-size="42">identified</text>
    </g>
    <g>
      <circle cx="785" cy="490" r="92" fill="#26596c" stroke="#f4bb55" stroke-width="5"/>
      <text x="785" y="480" fill="#ffffff" font-size="46" font-weight="700" data-role="decision-label">Demonstrate</text>
      <text x="785" y="535" fill="#ffe0a1" font-size="42">and question</text>
    </g>
    <g>
      <circle cx="1060" cy="490" r="92" fill="#173f57" stroke="#78d6df" stroke-width="5"/>
      <text x="1060" y="480" fill="#ffffff" font-size="46" font-weight="700" data-role="decision-label">Authorize</text>
      <text x="1060" y="535" fill="#b9dde7" font-size="42">with limits</text>
    </g>
    <g>
      <circle cx="1335" cy="490" r="92" fill="#173f57" stroke="#78d6df" stroke-width="5"/>
      <text x="1335" y="480" fill="#ffffff" font-size="46" font-weight="700" data-role="decision-label">Recheck</text>
      <text x="1335" y="535" fill="#b9dde7" font-size="42">after change</text>
    </g>
  </g>
  <rect x="120" y="680" width="1360" height="88" rx="18" fill="#0a1d2c" stroke="#2f6682" stroke-width="3"/>
  <text x="155" y="737" fill="#d7ebf3" font-family="Arial, sans-serif" font-size="42">Hold use when identity, instructions, competence, site controls, or authorization evidence is unresolved.</text>
  <text x="1390" y="802" fill="#78d6df" font-family="Arial, sans-serif" font-size="42" font-weight="700">ARCLIFT</text>
</svg>
